<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F4F0E6"><title>Set up your store — bck.</title><link rel="stylesheet" href="onboarding.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script></head><body><main class="onboard-shell"><a class="brand" href="index.html">bck<b>.</b></a><button id="signout" class="exit">Sign out</button><section class="onboard-wrap"><div class="intro"><span class="kicker">Merchant setup</span><h1>Set up your store.</h1><p>Two short steps, then your BCK dashboard is ready.</p></div><div class="steps"><div class="step active" data-step-ind="1"><span>1</span><strong>Store identity</strong></div><i></i><div class="step" data-step-ind="2"><span>2</span><strong>Contact details</strong></div></div><form id="onboardingForm"><section class="stage active" data-step="1"><div class="card"><label class="upload-box" for="logoInput"><div id="logoPreview" class="logo-preview"><i data-lucide="store"></i></div><strong>Store logo <em>optional</em></strong><span>PNG, JPG or WebP · max 5 MB</span><input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><div class="divider"></div><div class="field"><label>Store name *</label><input id="businessName" required placeholder="e.g. Bean & Brew Coffee"></div><div class="field"><label>Store description *</label><textarea id="businessDescription" required placeholder="Tell customers what your store is about..."></textarea></div></div><div class="actions"><span></span><button class="btn ink" id="nextBtn" type="button">Continue <i data-lucide="arrow-right"></i></button></div></section><section class="stage" data-step="2"><div class="card"><div class="field"><label>Your name *</label><input id="ownerName" required placeholder="Full name"></div><div class="field"><label>Phone number *</label><input id="phone" required inputmode="tel" placeholder="+91 98765 43210"></div><div class="location-grid"><div class="field"><label>Country *</label><select id="country" required disabled><option>Loading countries…</option></select></div><div class="field"><label>State / region *</label><select id="stateRegion" required disabled><option value="">Select country first…</option></select></div><div class="field full"><label>City / town / village *</label><input id="city" required list="localityOptions" autocomplete="address-level2" placeholder="Select a state first" disabled><datalist id="localityOptions"></datalist><small id="localityHelp" class="field-help">Choose a state first. Then start typing your city, town or village.</small></div></div><div class="field"><label>Store address *</label><textarea id="address" required placeholder="Street address, area, PIN code"></textarea></div></div><label class="agree"><input id="terms" type="checkbox" required><span>I agree to the Terms & Conditions.</span></label><div class="actions"><button class="btn ghost" id="backBtn" type="button">Back</button><button class="btn primary" id="submitBtn" type="submit">Go to dashboard <i data-lucide="circle-check"></i></button></div></section><div id="alert" class="alert"></div></form></section></main><script src="location-data.js"></script><script src="onboarding.js"></script></body></html>
